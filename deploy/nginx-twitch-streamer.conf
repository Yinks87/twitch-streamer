# Reverse Proxy für den Twitch Loop Player hinter einer DuckDNS-Domain.
# __DOMAIN__ wird von deploy/install.sh durch z. B. meinstream.duckdns.org ersetzt.
# TLS/HTTPS fügt danach `certbot --nginx -d __DOMAIN__` automatisch hinzu
# (Zertifikat, 443-Server-Block und HTTP→HTTPS-Redirect).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads sind große Videodateien.
    client_max_body_size 30G;
    # Direkt zum Container durchreichen statt auf Platte zwischenzupuffern.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
